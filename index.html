<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebDev Hub - Tự Tạo Link Website</title>
    <!-- Liên kết tới file CSS tách biệt -->
    <link rel="stylesheet" href="style.css">
    <!-- Liên kết tới file JS tách biệt -->
    <script src="script.js" defer></script>
</head>
<body>

    <header>
        <h1>🌐 WebDev Hub</h1>
        <p>Gõ code tạo web và biến thành đường link chia sẻ ngay lập tức!</p>
    </header>

    <div class="container">
        
        <h2 class="section-title">🛠️ Thử Nghiệm &amp; Tạo Link Rút Gọn</h2>
        <div class="editor-wrapper">
            <p class="editor-title">Sửa code bên dưới:</p>
            
            <textarea id="code-input"><!-- Viết code HTML/CSS của bạn ở đây -->
<h1 style="color: #ff5722; text-align: center; font-family: sans-serif;">Hello World!</h1>
<p style="text-align: center; color: #333; font-family: sans-serif;">Trang web này được tạo ra từ một đường link duy nhất đấy bro!</p>
<button style="display:block; margin:auto; padding:10px 20px; background:#0366d6; color:#fff; border:none; border-radius:5px;" onclick="alert('Chào bro!')">Bấm thử đi</button></textarea>
            
            <!-- HÀNG NÚT BẤM MỚI -->
            <div class="btn-group">
                <button class="btn-run" onclick="runCode()">🚀 CHẠY THỬ CODE</button>
                <button class="btn-link" onclick="generateWebLink()">🔗 TẠO LINK CHIA SẺ</button>
            </div>
            
            <!-- KHU VỰC HIỂN THỊ LINK SAU KHI TẠO -->
            <div id="link-output-area" class="link-box" style="display: none;">
                <p>Sao chép link này gửi cho bạn bè nhé bro:</p>
                <div class="copy-group">
                    <input type="text" id="shareable-link" readonly>
                    <button onclick="copyToClipboard()">Copy</button>
                </div>
            </div>

            <p class="output-label">Kết quả hiển thị thực tế:</p>
            <iframe id="code-output"></iframe>
        </div>

    </div>

    <footer>
        <p>© Cộng đồng làm web siêu tốc lưu trữ trên GitHub Pages</p>
    </footer>

</body>
</html>
