<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebDev Hub - Tự Làm Website Miễn Phí</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <header>
        <h1>🌐 WebDev Hub</h1>
        <p>Thư viện tạo trang web tốc độ cao và xuất bản trực tuyến</p>
    </header>

    <div class="container">
        
        <h2 class="section-title">🛠️ Thử Nghiệm &amp; Xuất Bản Độc Lập</h2>
        <div class="editor-wrapper">
            <p class="editor-title">Sửa code bên dưới và bấm Xuất bản:</p>
            
            <textarea id="code-input"><!-- Viết code HTML/CSS của bạn ở đây -->
<div style="background: linear-gradient(135deg, #667eea, #764ba2); color: white; padding: 40px; text-align: center; border-radius: 10px; font-family: sans-serif;">
    <h1>Trang Web Cá Nhân Của Tôi 🚀</h1>
    <p>Đây là trang độc lập được tạo trực tiếp từ điện thoại.</p>
    <button style="padding: 10px 20px; border: none; border-radius: 5px; background: white; color: #764ba2; font-weight: bold; cursor: pointer;" onclick="alert('Cảm ơn bro đã ghé thăm!')">Bấm Vào Tôi</button>
</div></textarea>
            
            <div class="btn-group">
                <button class="btn-run" onclick="runCode()">🚀 CHẠY THỬ CODE</button>
                <button class="btn-link" onclick="publishLivePage()">🌐 XUẤT BẢN TRANG WEB</button>
            </div>
            
            <!-- KHU VỰC HIỂN THỊ LINK SAU KHI XUẤT BẢN -->
            <div id="link-output-area" class="link-box" style="display: none;">
                <p>🎉 Xuất bản thành công! Đây là đường link trang web độc lập của bạn:</p>
                <div class="copy-group">
                    <input type="text" id="shareable-link" readonly>
                    <button onclick="copyToClipboard()">Copy Link</button>
                </div>
            </div>

            <p class="output-label">Xem trước khung chạy thử:</p>
            <iframe id="code-output"></iframe>
        </div>

    </div>

    <footer>
        <p>© Cộng đồng làm web siêu tốc lưu trữ trên GitHub Pages</p>
    </footer>

</body>
</html>
